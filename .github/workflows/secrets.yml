name: Secret Scan

# Applies the same gitleaks rules as the local pre-push hook, so a secret that
# reaches a branch is caught in CI and not only on a developer machine. The scan
# covers the commits a push or pull request introduces; the inherited upstream
# history still holds test fixtures that predate this gate, so a full-history
# scan is available on demand instead of blocking every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan every commit instead of only the new ones
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the new commits for secrets
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          scope=""
          if [ "$FULL_HISTORY" != true ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ]; then
            scope="--log-opts=${BEFORE}..${GITHUB_SHA}"
          else
            echo "Scanning the full history because no new-commit range was available"
          fi
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            git --no-banner --redact --config .gitleaks.toml $scope .
