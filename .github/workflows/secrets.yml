name: Secret Scan

# Runs the same gitleaks rules the local pre-push hook applies, so a secret that
# reaches a branch is caught in CI and not only on a developer machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the full history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.30.1 \
            git --no-banner --redact --config .gitleaks.toml .
