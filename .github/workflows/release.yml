name: Release

# Builds every platform binary from the tagged commit and attaches them, plus
# checksums and the changelog entry, to a GitHub Release. Tag creation belongs
# to this workflow: never create release tags by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release. Defaults to v<version> from src/main.zig.
        required: false
        type: string
      dry_run:
        description: Build every platform and verify the release assets without
          creating the tag or the release.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.16.0"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve the release
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pub const version = "\(.*\)";$/\1/p' src/main.zig)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          tag="v${version}"
          if [ "$EVENT" = push ]; then
            tag="${PUSHED_REF#refs/tags/}"
            if [ "$tag" != "v${version}" ]; then
              echo "::error::tag ${tag} does not match src/main.zig version ${version}"
              exit 1
            fi
          elif [ -n "${REQUESTED_TAG:-}" ]; then
            if [ "$REQUESTED_TAG" != "$tag" ]; then
              echo "::error::requested tag ${REQUESTED_TAG} does not match src/main.zig version ${version}"
              exit 1
            fi
            tag="$REQUESTED_TAG"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          notes="$(sed -n '/<!-- release:start -->/,/<!-- release:end -->/p' CHANGELOG.md | sed '1d;$d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no content between the release markers"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md

          if [ "$DRY_RUN" = true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: building and verifying assets for ${tag} without publishing"
          elif [ "$EVENT" = push ] || git rev-parse "$tag" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            git tag -- "$tag"
            git push origin "refs/tags/${tag}"
            echo "Created tag ${tag}"
          fi

  build:
    name: Build release binaries
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: di-*
          merge-multiple: true
          path: dist

      - name: Collect assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp release-notes.md dist/
          cd dist
          rm -f SHA256SUMS.*
          shopt -s nullglob
          assets=(*.tar.gz *.zip)
          shopt -u nullglob
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release binaries were produced"
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
          if [ "$PUBLISH" != true ]; then
            echo "Dry run complete: ${#assets[@]} assets verified for ${TAG}, nothing published"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes-file release-notes.md \
              "${assets[@]}" SHA256SUMS
          else
            gh release upload "$TAG" "${assets[@]}" SHA256SUMS --clobber
          fi
          echo "Published $TAG with ${#assets[@]} binaries"
